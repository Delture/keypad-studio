name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/constants.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) { throw "VERSION $version does not match tag $tag" }
          Write-Host "Building version $version"

      - name: Build with PyInstaller
        run: python -m PyInstaller KeypadStudio.spec --noconfirm --clean

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/KeypadStudio/* -DestinationPath KeypadStudio-win64.zip -CompressionLevel Optimal
          $size = (Get-Item KeypadStudio-win64.zip).Length / 1MB
          Write-Host ("Archive: {0:N1} MB" -f $size)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeypadStudio-win64
          path: KeypadStudio-win64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeypadStudio-win64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
