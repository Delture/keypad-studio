<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Keypad Studio</title>
  <link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="crumbs">
        <button class="back-btn" id="back-btn" data-action="go-back" title="返回" aria-label="返回"></button>
        <div class="brand-mark" title="Keypad Studio">
          <div class="brand-dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <h2 id="crumb-title">设备总览</h2>
      </div>
      <div class="top-actions">
        <button class="profile-pill" data-action="open-profile-menu" title="切换配置">
          <span class="profile-dot" id="profile-dot"></span>
          <span id="profile-name">默认配置</span>
        </button>
        <span class="top-divider"></span>
        <button class="top-nav-btn" data-nav="actions" title="动作库" aria-label="动作库"></button>
        <button class="top-nav-btn" data-nav="profiles" title="配置" aria-label="配置"></button>
        <button class="top-nav-btn" id="theme-toggle" data-action="toggle-theme" title="切换明暗主题" aria-label="切换明暗主题"></button>
        <button class="top-nav-btn" data-nav="settings" title="设置" aria-label="设置"></button>
      </div>
    </header>

    <main class="view" id="view">
      <div class="view-inner" id="view-inner">
        <div class="empty">
          <div class="empty-icon" id="loading-icon"></div>
          <h3>正在加载 Keypad Studio</h3>
          <p>正在读取设备与配置…</p>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
